[project]
name = "paper-to-notebook"
version = "0.1.0"
description = "An ADK agent that reads an arXiv paper and turns its core method into a runnable notebook."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "google-adk>=2.15.1",
]

[project.scripts]
paper-to-notebook = "paper_to_notebook:main"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"
